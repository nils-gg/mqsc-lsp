# Example Helix config for mqsc-lsp.
# Merge into ~/.config/helix/languages.toml and adjust paths.
#
# Helix requires a tree-sitter grammar (for parsing/highlighting) IN ADDITION
# to the language server. The helix grammar registry has no mqsc entry, so
# `:grammar install mqsc` cannot work — the manual source recipe is the only
# way to get the grammar:
#
#   1. symlink (or copy) this repository's grammars/tree-sitter-mqsc to
#        ~/.config/helix/runtime/grammars/sources/mqsc
#   2. make sure that folder carries queries/highlights.scm (copy it from
#        grammars/tree-sitter-mqsc/queries/highlights.scm
#      — where this repository keeps its highlighting queries),
#   3. run  :grammar install  in helix — it then compiles the committed
#      src/parser.c + src/scanner.c from that source tree itself.

[[language]]
name = "mqsc"
scope = "source.mqsc"
injection-regex = "mqsc"
file-types = ["mqsc"]
comment-token = "*"
# No block comments: '*' only comments in column 0 (wrapping text as
# *text* would produce wildcard tokens, not a comment).
roots = ["."]
indent-tabs = false
language-server = { command = "/path/to/mqsc-lsp/server/target/release/mqsc-lsp" }  # EDIT ME

# Rename (helix >= 24.03): helix only consults the server's prepareRename
# gate when prepare-support is on — and it defaults to OFF. Without it helix
# prompts for a rename on ANY word (DEFINE, QLOCAL, ...), pre-fills with its
# own word guess (wrong around 'quoted' names) and only fails after you
# type, because the server rejects non-name positions. With prepare-support
# the gate holds: verbs refuse immediately ("nothing to rename"), and at a
# quoted name helix selects the name WITHOUT its quotes.
rename-support = { prepare-support = true }
# The rename workspace edit can touch several open documents; helix applies
# more than the current file's edits only with workspace-edit on.
workspace-support = { workspace-edit = true }

# Grammar install: released helix takes grammars from its own runtime
# sources (`:grammar install` after symlinking, see the comment at the top)
# — a [[grammar]] entry with source = { path = ... } is not a supported
# form, so none is declared here.
