name: CI

# The repo pins rustc 1.75 (MSRV, see AGENTS.md): dependency versions in
# server/Cargo.toml carry `=` pins that only resolve there, so the FULL
# gate set (fmt, clippy, model guard, CLI exit codes, both smoke sessions)
# runs on exactly that toolchain. fmt/clippy are deliberately MSRV-only:
# a newer clippy adds lints and -D warnings would fail on style we did
# not choose. The stable/windows/macos jobs answer the other question —
# does the locked dependency set still compile and pass tests on a modern
# toolchain and on the platforms the Release workflow ships binaries for.
# They build with --locked, so they test precisely the versions the lock
# pins; a red job there means a real MSRV-rot or platform regression.
# The Python smoke harnesses are Linux-only by design (os.set_blocking).

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: full gates (ubuntu, rust 1.75 = MSRV)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: release versions agree (Cargo.toml vs extension package.json)
        run: python3 tools/check_versions.py

      - name: extension server-resolution behavior (stubbed vscode host)
        run: node tools/extension_resolve_test.js

      - name: extension settings plumbing behavior (stubbed vscode host)
        run: node tools/extension_config_test.js

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: 1.75.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: server

      - name: cargo fmt --check
        working-directory: server
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        working-directory: server
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test (unit + grammar corpus through the linked parser)
        working-directory: server
        run: cargo test

      # "probe must never panic" is a documented contract (AGENTS.md); this
      # is its mechanical guard — probe always exits 0 unless it panicked
      # (101) or could not read stdin (2), so rc==0 IS the assertion.
      - name: probe never panics (fixtures + torture shapes, REVIEW T2)
        working-directory: server
        shell: bash
        run: |
          cargo build --examples
          rc=0
          for f in ../examples/sample.mqsc ../tools/demo/fixture.mqsc; do
            ./target/debug/examples/probe < "$f" > /dev/null 2> probe.err
            st=$?
            if [ $st -ne 0 ]; then
              echo "probe failed on $f (rc=$st):"; cat probe.err; rc=1
            fi
          done
          # torture shapes: unterminated string, stray ')', CRLF endings,
          # non-UTF-8 bytes, empty input — the lossy-decode promise means
          # every one of these must parse-and-report, never crash
          i=0
          for t in "DEFINE QLOCAL(A) DESCR('unterminated" \
                   "ALTER QLOCAL(A)) MAXDEPTH(9" \
                   "ALTER QLOCAL(A\r\nMAXDEPTH(9)\r\n" \
                   "DEFINE QLOCAL(\xff\xfe) DESCR('x')" \
                   ""; do
            i=$((i+1))
            printf "$t" | ./target/debug/examples/probe > /dev/null 2> probe.err
            st=$?
            if [ $st -ne 0 ]; then
              echo "probe failed on torture input $i (rc=$st):"; cat probe.err; rc=1
            fi
          done
          rm -f probe.err
          exit $rc

      - name: cargo build --release
        working-directory: server
        run: cargo build --release

      # build.rs replays a cc warning as `cargo:warning=` lines that used to
      # scroll by unnoticed (REVIEW F9). rust-cache can skip the compile
      # entirely, so touch the C inputs first — this asserts the warning
      # stays fixed, not merely absent from a cache hit.
      - name: grammar C sources compile warning-free
        working-directory: server
        shell: bash
        run: |
          touch build.rs ../grammars/tree-sitter-mqsc/src/parser.c \
                ../grammars/tree-sitter-mqsc/src/scanner.c
          out=$(cargo build --release 2>&1)
          if printf '%s\n' "$out" | grep -q 'cargo:warning'; then
            echo "build.rs reported C warnings:"
            printf '%s\n' "$out" | grep 'cargo:warning'
            exit 1
          fi

      - name: LSP smoke session against the release binary
        run: python3 tools/lsp_smoke_test.py server/target/release/mqsc-lsp

      - name: workspace index smoke (scan, watcher registration, fs events)
        run: python3 tools/workspace_index_smoke.py server/target/release/mqsc-lsp

      - name: model regeneration guard (skips without the IBM reference)
        run: |
          # C4 (REVIEW 2026-10-31): the byte-comparison can NEVER run here —
          # the IBM reference is copyrighted and gitignored, so this step
          # always SKIPs on CI. Say it as an annotation instead of letting
          # the skip scroll by unnoticed: the guard is a local guarantee.
          if [ ! -f MQSC_ScriptCommandReference.md ]; then
            echo "::notice title=Model guard is local-only::the IBM reference is absent on CI runners; byte-reproducibility is verified by local runs, not by this job"
          fi
          python3 tools/check_model.py

      - name: --check CLI end-to-end
        run: |
          echo "DEFINE QLOCAL(A) MAXMSGS" > /tmp/w.mqsc
          # Assert the EXACT exit codes: rc=1 (error finding) and rc=0 (off).
          # Anything else — rc=2 (usage/IO), rc=101 (panic) — is a regression
          # and must not read as "expected failure" (REVIEW.md M2).
          rc=0
          server/target/release/mqsc-lsp --check /tmp/w.mqsc || rc=$?
          if [ $rc -ne 1 ]; then
            echo "expected exit 1 for the MAXMSGS error, got $rc"; exit 1
          fi
          rc=0
          server/target/release/mqsc-lsp --check --diag UNKNOWN_PARAM=off /tmp/w.mqsc || rc=$?
          if [ $rc -ne 0 ]; then
            echo "expected exit 0 with UNKNOWN_PARAM=off, got $rc"; exit 1
          fi

  stable:
    name: test + smoke (ubuntu, stable Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: server

      - name: cargo test --locked (catches MSRV/pin rot early)
        working-directory: server
        run: cargo test --locked

      - name: cargo build --release --locked
        working-directory: server
        run: cargo build --release --locked

      - name: LSP smoke session against the stable-built binary
        run: python3 tools/lsp_smoke_test.py server/target/release/mqsc-lsp

  windows:
    name: test (windows msvc, stable Rust)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: server

      # The same tree-sitter C files the Release job ships, compiled by
      # MSVC; the tests are the portability check (URI/path handling was
      # the one Windows-hostile spot, fixed in PR 10).
      # Failure output goes out through TWO public surfaces: the step
      # summary (for logged-in readers) and a ::error:: annotation —
      # anonymous visitors can read annotations, but GitHub hides step
      # summaries and logs from anyone without repo rights, so the
      # annotation is the channel that is actually public.
      - name: cargo test --locked
        shell: bash
        working-directory: server
        run: set -o pipefail; cargo test --locked 2>&1 | tee ../test-output.log

      - name: Publish failure output (public step summary + annotation)
        if: failure()
        shell: bash
        run: |
          # C3 (REVIEW 2026-10-31): under bash -e, a `tail` on a log that
          # was never written (failure BEFORE the cargo step — precisely
          # when the annotation matters most) aborted this script and the
          # public ::error:: never shipped. Stay tolerant; the publisher
          # handles the missing file itself.
          { echo "## cargo test --locked (tail)"; echo '```'
            tail -c 20000 test-output.log 2>/dev/null \
              || echo '(no test-output.log: the job failed before cargo test ran)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ci_publish_failure.py test-output.log "cargo test --locked"

  macos:
    name: test (macos, stable Rust)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: server

      - name: cargo test --locked
        shell: bash
        working-directory: server
        run: set -o pipefail; cargo test --locked 2>&1 | tee ../test-output.log

      - name: Publish failure output (public step summary + annotation)
        if: failure()
        shell: bash
        run: |
          # C3 (REVIEW 2026-10-31): under bash -e, a `tail` on a log that
          # was never written (failure BEFORE the cargo step — precisely
          # when the annotation matters most) aborted this script and the
          # public ::error:: never shipped. Stay tolerant; the publisher
          # handles the missing file itself.
          { echo "## cargo test --locked (tail)"; echo '```'
            tail -c 20000 test-output.log 2>/dev/null \
              || echo '(no test-output.log: the job failed before cargo test ran)'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          python3 tools/ci_publish_failure.py test-output.log "cargo test --locked"
