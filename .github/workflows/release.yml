name: Release

# Tag convention: push a tag `vX.Y.Z` to publish a GitHub Release carrying
# the server binaries for every platform the extension can use (patch.md
# Phase 5): linux x86_64/aarch64, windows msvc x86_64, macos x86_64/aarch64,
# plus the packaged VSIX. The version check is the first job: the tag,
# server/Cargo.toml, editors/vscode/extension/package.json and the
# package-lock.json root entry must agree, so a release can never
# advertise artifacts it did not build (CHANGELOG.md is updated in the
# same commit as the version bumps).
# Every platform builds on its own hosted runner with the pinned MSRV
# (1.75) — the `=` dependency pins make the release exactly reproducible
# with what CI's full gates ran; no cross-linkers to bit-rot.

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    name: tag / Cargo.toml / package.json / lock agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: versions agree with the tag
        run: python3 tools/check_versions.py "$GITHUB_REF_NAME"

  linux-x86_64:
    name: binary x86_64-unknown-linux-gnu
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: 1.75.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: server
      - name: Build release binary
        working-directory: server
        run: cargo build --release --locked
      - name: Smoke-test the exact artifact
        run: python3 tools/lsp_smoke_test.py server/target/release/mqsc-lsp
      - name: Package
        run: |
          strip server/target/release/mqsc-lsp
          tar -C server/target/release -czf \
            "mqsc-lsp-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" mqsc-lsp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: linux-x86_64
          path: mqsc-lsp-*-x86_64-unknown-linux-gnu.tar.gz

  linux-aarch64:
    name: binary aarch64-unknown-linux-gnu
    runs-on: ubuntu-24.04-arm
    needs: check-version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: 1.75.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: server
      - name: Build release binary (native on the arm runner)
        working-directory: server
        run: cargo build --release --locked
      - name: Smoke-test the exact artifact
        run: python3 tools/lsp_smoke_test.py server/target/release/mqsc-lsp
      - name: Package
        run: |
          strip server/target/release/mqsc-lsp
          tar -C server/target/release -czf \
            "mqsc-lsp-${GITHUB_REF_NAME}-aarch64-unknown-linux-gnu.tar.gz" mqsc-lsp
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: linux-aarch64
          path: mqsc-lsp-*-aarch64-unknown-linux-gnu.tar.gz

  windows-x86_64:
    name: binary x86_64-pc-windows-msvc
    runs-on: windows-latest
    needs: check-version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: 1.75.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: server
      - name: Build release binary
        working-directory: server
        run: cargo build --release --locked
      - name: "Package (zip: the Windows convention)"
        shell: pwsh
        run: |
          # C1 (REVIEW 2026-10-31): no expression interpolation into the
          # script — read the env like every other step does. (Never write
          # a literal dollar-brace-brace expression here, not even in a
          # comment: Actions evaluates expressions over the raw file and
          # an empty one invalidates the whole workflow — PR #1 release
          # incident.) The braces below matter: a hyphen is a legal
          # PowerShell variable character, so bare $env:GITHUB_REF_NAME-x86_64
          # would look up a bogus variable name.
          Compress-Archive -Path server\target\release\mqsc-lsp.exe `
            -DestinationPath "mqsc-lsp-${env:GITHUB_REF_NAME}-x86_64-pc-windows-msvc.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: windows-x86_64
          path: mqsc-lsp-*-x86_64-pc-windows-msvc.zip

  macos:
    name: binaries apple-darwin (x86_64 + aarch64)
    runs-on: macos-14
    needs: check-version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8  # master
        with:
          toolchain: 1.75.0
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: server
      # macos-14 is an arm64 runner: aarch64 is native, x86_64 cross-builds
      # against the same SDK (one clang, -arch handled by cargo's target).
      - name: Build both release binaries
        working-directory: server
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Smoke-test the native (arm64) artifact
        run: |
          set -o pipefail
          python3 tools/lsp_smoke_test.py \
            server/target/aarch64-apple-darwin/release/mqsc-lsp 2>&1 | tee smoke-macos.log
      - name: Publish smoke failure (public annotation)
        if: failure()
        run: python3 tools/ci_publish_failure.py smoke-macos.log "macOS smoke"
      - name: Package
        run: |
          for arch in aarch64 x86_64; do
            strip "server/target/${arch}-apple-darwin/release/mqsc-lsp"
            tar -C "server/target/${arch}-apple-darwin/release" -czf \
              "mqsc-lsp-${GITHUB_REF_NAME}-${arch}-apple-darwin.tar.gz" mqsc-lsp
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: macos
          path: mqsc-lsp-*-apple-darwin.tar.gz

  vsix:
    name: package the VS Code extension
    runs-on: ubuntu-latest
    needs: check-version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 20
      - name: Install extension dependencies
        working-directory: editors/vscode/extension
        run: npm ci
      - name: Extension behavior gate (server resolution)
        run: node tools/extension_resolve_test.js
      - name: vsce package
        working-directory: editors/vscode/extension
        run: npx --yes @vscode/vsce package --allow-star-activation
      - name: Rename to carry the release tag
        working-directory: editors/vscode/extension
        run: mv mqsc-lsp-vscode-*.vsix "mqsc-lsp-${GITHUB_REF_NAME}-vscode.vsix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: vscode-vsix
          path: editors/vscode/extension/mqsc-lsp-*-vscode.vsix

  release:
    name: publish with SHA256SUMS
    runs-on: ubuntu-latest
    needs: [check-version, linux-x86_64, linux-aarch64, windows-x86_64, macos, vsix]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true
      - name: One checksum file for everything
        run: |
          # C2 (REVIEW 2026-10-31): v0.1.3 carried a MANUALLY uploaded
          # demo.gif that this file could not vouch for, which made the
          # step name a lie. The gif now ships from the tagged tree, so
          # SHA256SUMS really covers every published asset.
          cp docs/demo.gif dist/
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/*
          generate_release_notes: true
      - name: Every published asset is checksummed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The other half of C2: after publishing, diff the live asset
          # list against the checksum file, both directions. A manual
          # upload (the demo.gif incident) or a silently dropped asset
          # fails the release job instead of shipping an unverifiable
          # Release page. LC_ALL=C because sort/comm must agree on the
          # collation; and $2 (not cut -d' ') because sha256sum separates
          # hash from name with TWO spaces.
          #
          # Reading the live list is guarded three ways (the v0.2.0 run
          # lesson): `assets` is the real gh JSON field (`assetNames` does
          # not exist — gh printed "Unknown JSON field", the | sort pipe
          # swallowed its exit code because bash steps have no pipefail,
          # and an empty list made every asset look "missing"); `if !`
          # checks gh's own status without a pipe; and the zero-asset
          # guard turns even a future silent emptiness into a clear
          # failure instead of a wrong diff.
          { awk '{print $2}' dist/SHA256SUMS; echo SHA256SUMS; } \
            | LC_ALL=C sort > /tmp/expected
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' > /tmp/actual; then
            echo "::error::could not read the live release's asset list"
            exit 1
          fi
          if [ ! -s /tmp/actual ]; then
            echo "::error::the live release reports zero assets"
            exit 1
          fi
          LC_ALL=C sort -o /tmp/actual /tmp/actual
          extra=$(LC_ALL=C comm -13 /tmp/expected /tmp/actual | tr '\n' ' ')
          if [ -n "$extra" ]; then
            echo "::error::release asset(s) not covered by SHA256SUMS: $extra"; exit 1
          fi
          lost=$(LC_ALL=C comm -23 /tmp/expected /tmp/actual | tr '\n' ' ')
          if [ -n "$lost" ]; then
            echo "::error::SHA256SUMS lists asset(s) missing from the release: $lost"; exit 1
          fi
          echo "OK: release assets and SHA256SUMS describe the same set"
